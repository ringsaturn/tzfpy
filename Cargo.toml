[package]
edition = "2024"
name = "tzfpy"
repository = "https://github.com/ringsaturn/tzfpy"
version = "2.1.0-beta.1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The name of the native library. This is the name which will be used in Python to import the
# library (i.e. `import string_sum`). If you change this, you must also change the name of the
# `#[pymodule]` in `src/lib.rs`.
name = "tzfpy"
# "cdylib" is necessary to produce a shared library for Python to import from.
#
# Downstream Rust code (including code in `bin/`, `examples/`, and `tests/`) will not be able
# to `use string_sum;` unless the "rlib" or "lib" crate type is also included, e.g.:
# crate-type = ["cdylib", "rlib"]
crate-type = ["cdylib"]

[dependencies]
lazy_static = "1.5.0"
pyo3 = {version = "0.29.0", features = ["extension-module", "generate-import-lib", "abi3-py310"]}

# Lite (default, feature "lite"): the ~4 MB lite.tzb that tzf-dist bundles in
# its crates.io package. This is the variant published to PyPI and the one
# conda-forge builds.
#
# A path dependency MUST NOT be published: it makes the crates.io/conda-forge
# vendoring path unbuildable and bloats the sdist with a copy of tzf-rs+tzf-dist.
tzf-rs = { version = "2.0.0", default-features = false, features = ["bundled", "export-geojson"], optional = true }
# tzf-rs = { path = "../tzf-rs", default-features = false, features = ["bundled", "export-geojson"], optional = true }

# Full precision (feature "full"): the ~14 MB full.tzb, no topology
# simplification. tzf-dist excludes full.tzb from its crates.io package and
# crates.io forbids git dependencies, so this variant can only be built
# against tzf-rs from git (the same tag as the crates.io release above).
# Experimental in the Python binding: wheels ship to GitHub Releases and the
# GitHub Pages index as `+full` local versions, never to PyPI.
#
# Mutually exclusive with "lite": build with
#   maturin build --no-default-features --features full
tzf-rs-full = { package = "tzf-rs", git = "https://github.com/ringsaturn/tzf-rs", tag = "v2.0.0", default-features = false, features = ["full", "export-geojson"], optional = true }
# tzf-rs-full = { package = "tzf-rs", path = "../tzf-rs", default-features = false, features = ["full", "export-geojson"], optional = true }

# The full variant runs on `EmbeddedFinder`, which queries full.tzb in place
# instead of expanding it into owned polygons (DefaultFinder::new_full() costs
# ~200 MB RSS). tzf-rs has no `EmbeddedFinder::new_full()` and does not
# re-export tzf-dist, so the bytes come straight from tzf-dist. Must point at
# the exact git rev tzf-rs v2.0.0 pins for its own `tzf-dist-git` dependency,
# so cargo unifies the two into one package.
tzf-dist-full = { package = "tzf-dist", git = "https://github.com/ringsaturn/tzf-dist", rev = "v0.0.2026-c-tzb1", features = ["full"], optional = true }
# tzf-dist-full = { package = "tzf-dist", path = "../tzf-dist", features = ["full"], optional = true }

[features]
default = ["lite"]
lite = ["dep:tzf-rs"]
full = ["dep:tzf-rs-full", "dep:tzf-dist-full"]
